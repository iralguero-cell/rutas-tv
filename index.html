<style>
/* Versión para navegadores de smart TV (Samsung Tizen): sin variables CSS, sin grid, sin gap en flex, sin max()/env().
   Colores del logo: tinta #1e1e1c, morado #5a287e; morado claro #b99ad6; fondo #17161a; panel #232128; línea #34303c. */
html, body { height: 100%; margin: 0; padding: 0; }
body { background: #17161a; color: #f4f2f6; font-family: "Archivo", "Helvetica Neue", Arial, sans-serif; overflow: hidden; cursor: none; }
body.pointer { cursor: default; }
* { box-sizing: border-box; }
.stage { height: 100%; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.gutter { padding-left: 3vmin; padding-right: 3vmin; }

.top { background: #fff; color: #1e1e1c; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; padding-top: 2vmin; padding-bottom: 2vmin; border-bottom: .9vmin solid #5a287e; -webkit-flex: none; flex: none; }
.brand { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; min-width: 0; }
.brand > * { margin-right: 2.6vmin; }
.logo { height: 6.4vmin; width: 24.4vmin; display: block; -webkit-flex: none; flex: none; }
.brand .sep { width: 2px; height: 6.4vmin; background: #dcd6e2; }
.brand .place { line-height: 1.05; min-width: 0; }
.brand .place b { display: block; font-weight: 800; font-style: italic; font-size: 3.6vmin; }
.brand .place span { display: block; color: #6d6774; font-size: 2.2vmin; font-weight: 500; white-space: nowrap; }
.when { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.date { font-weight: 600; font-size: 3vmin; color: #4a4552; white-space: nowrap; margin-right: 2.6vmin; }
.clock { font-weight: 800; font-size: 5.6vmin; color: #fff; background: #5a287e; padding: .4vmin 1.8vmin; border-radius: .8vmin; line-height: 1.1; }

.slides { position: relative; -webkit-flex: 1; flex: 1; min-height: 0; margin-top: 3vmin; margin-bottom: 1.6vmin; }
.slide { position: absolute; top: 0; bottom: 0; left: 3vmin; right: 3vmin; opacity: 0; -webkit-transition: opacity .55s ease; transition: opacity .55s ease; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.slide.on { opacity: 1; }
.slide > * + * { margin-top: 2.4vmin; }

.eyebrow { font-weight: 700; text-transform: uppercase; letter-spacing: .16em; color: #b99ad6; font-size: 2.5vmin; }
h1, h2 { margin: 0; font-weight: 900; font-style: italic; line-height: .95; }
h1 { font-size: 7.6vmin; }
h2 { font-size: 9.6vmin; }
.empty-note { font-size: 4vmin; color: #a39dab; margin: 0; }

.board-wrap { -webkit-flex: 1; flex: 1; min-height: 0; }
table.board { width: 100%; border-collapse: separate; border-spacing: 0 1vmin; }
.board th { font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: #a39dab; font-size: 2.2vmin; text-align: left; padding: 0 1.8vmin .2vmin; }
.board th.shift { text-align: center; }
.board th.shift span { display: inline-block; background: #5a287e; color: #fff; border-radius: .6vmin; padding: .3vmin 1.4vmin; letter-spacing: .06em; font-weight: 800; }
.board td { background: #232128; padding: 1.6vmin 1.8vmin; font-size: 3.2vmin; border-top: 1px solid #34303c; border-bottom: 1px solid #34303c; }
.board td:first-child { border-left: .7vmin solid #5a287e; border-radius: .8vmin 0 0 .8vmin; }
.board td:last-child { border-right: 1px solid #34303c; border-radius: 0 .8vmin .8vmin 0; }
.board td.name { font-weight: 800; font-size: 3.8vmin; white-space: nowrap; }
.board td.cell { text-align: center; font-weight: 800; font-size: 4.6vmin; }
.board td.cell.empty { color: #34303c; }
.board td .multi { display: block; font-size: 3.4vmin; }
.board td.extra { font-size: 2.9vmin; }
.board td.extra .r { font-weight: 800; color: #f4f2f6; }
.board td.extra .s { font-weight: 600; color: #b99ad6; }

.driver { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
.driver .who { width: 42%; padding-right: 5vmin; }
.driver .who > * + * { margin-top: 2vmin; }
.driver .who .count { color: #a39dab; font-size: 3vmin; font-weight: 500; }
.tasks { width: 58%; list-style: none; margin: 0; padding: 0; }
.tasks > * + * { margin-top: 1.6vmin; }
.task { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; background: #232128; border: 1px solid #34303c; border-radius: 1vmin; padding: 1.8vmin 2.4vmin; }
.badge { width: 14vmin; -webkit-flex: none; flex: none; margin-right: 2.6vmin; font-weight: 900; font-style: italic; font-size: 4.8vmin; text-align: center; line-height: 1.15; color: #fff; background: #5a287e; border-radius: .6vmin; padding: .3vmin 0; }
.task.special .badge, .task.route .badge { background: transparent; color: #b99ad6; border: 2px solid #b99ad6; font-size: 2.6vmin; font-style: normal; text-transform: uppercase; letter-spacing: .08em; padding: 1.2vmin 0; }
.task .what { font-weight: 800; font-size: 6vmin; line-height: 1; }

.absences { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; margin-right: -2.4vmin; }
.absence { width: 47%; margin-right: 2.4vmin; margin-bottom: 2.4vmin; background: #232128; border: 1px solid #34303c; border-left: .9vmin solid #f0866f; border-radius: 1vmin; padding: 2.6vmin 3vmin; }
.absence > * + * { margin-top: 1.2vmin; }
.absence .kind { font-weight: 700; text-transform: uppercase; letter-spacing: .14em; color: #f0866f; font-size: 2.6vmin; }
.absence .n { font-weight: 900; font-style: italic; font-size: 5.6vmin; line-height: 1; }
.absence .d { font-size: 3vmin; }
.absence .r { font-size: 2.5vmin; color: #a39dab; }

.foot { -webkit-flex: none; flex: none; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding-top: 1.4vmin; padding-bottom: 2.2vmin; }
.foot > * { margin-right: 2.4vmin; }
.foot > *:last-child { margin-right: 0; }
.dots { display: -webkit-flex; display: flex; }
.dot { width: 1.4vmin; height: 1.4vmin; border-radius: 50%; background: #34303c; border: 0; padding: 0; margin-right: 1vmin; }
.dot.on { background: #b99ad6; }
.bar { -webkit-flex: 1; flex: 1; height: .6vmin; background: #34303c; border-radius: 1vmin; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: #b99ad6; }
.meta { color: #a39dab; font-size: 2.1vmin; white-space: nowrap; }
.ctl { background: transparent; color: #a39dab; border: 1px solid #34303c; border-radius: .6vmin; font: 600 2.1vmin Arial, sans-serif; padding: .6vmin 1.4vmin; }
.stale { color: #f0866f; font-weight: 700; }

/* Cabecera de cada diapositiva: día (Hoy / Mañana) + fecha + sección */
.kicker { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
.kicker > * { margin-right: 2vmin; }
.daytag { font-weight: 900; font-style: italic; font-size: 3vmin; text-transform: uppercase; letter-spacing: .06em; line-height: 1.2; padding: .3vmin 1.8vmin; border-radius: .6vmin; border: 2px solid #f4f2f6; color: #f4f2f6; }
.daytag.today { background: #5a287e; border-color: #5a287e; color: #ffffff; }
.dayname { font-weight: 600; font-size: 2.8vmin; color: #f4f2f6; }
.kicker .eyebrow { padding-left: 2vmin; border-left: 2px solid #34303c; }
/* Tabla compacta cuando hay muchos transportistas */
table.board.dense { border-spacing: 0 .7vmin; }
.board.dense td { padding-top: 1vmin; padding-bottom: 1vmin; font-size: 2.8vmin; }
.board.dense td.name { font-size: 3.2vmin; }
.board.dense td.cell { font-size: 3.8vmin; }
.board.dense td.extra { font-size: 2.7vmin; }

/* Origen de los datos y horarios */
.kicker .source { font-size: 2.2vmin; color: #a39dab; font-weight: 500; }
.board td.cell .multi { display: block; }
.board td.cell .time { display: block; font-size: 2vmin; font-weight: 600; color: #b99ad6; margin-top: .3vmin; }
.board td.extra .time-inline { font-size: 2.2vmin; color: #a39dab; font-weight: 500; }
.task .what small { display: block; font-weight: 500; font-size: 2.4vmin; color: #a39dab; margin-top: .6vmin; }

/* Recordatorio de los lunes: diapositiva de aviso a pantalla llena */
.slide.alert { -webkit-justify-content: center; justify-content: center; -webkit-align-items: center; align-items: center; text-align: center; background: #5a287e; border-radius: 2vmin; padding: 4vmin; -webkit-animation: alertPulse 2s ease-out infinite; animation: alertPulse 2s ease-out infinite; }
.slide.alert > * + * { margin-top: 3vmin; }
.key-icon { width: 20vmin; height: 20vmin; display: block; margin: 0 auto; -webkit-transform-origin: 30% 35%; transform-origin: 30% 35%; -webkit-animation: keySwing 1.6s ease-in-out infinite; animation: keySwing 1.6s ease-in-out infinite; }
.alert-tag { display: inline-block; font-weight: 800; text-transform: uppercase; letter-spacing: .18em; font-size: 2.8vmin; color: #5a287e; background: #ffffff; padding: .8vmin 2.4vmin; border-radius: 10vmin; }
.alert-msg { font-size: 10.5vmin; color: #ffffff; line-height: 1.02; max-width: 92%; }
.alert-msg mark { background: #ffffff; color: #5a287e; padding: 0 1.6vmin; border-radius: 1vmin; font-style: italic; }
@-webkit-keyframes keySwing { 0%, 100% { -webkit-transform: rotate(-12deg); } 50% { -webkit-transform: rotate(12deg); } }
@keyframes keySwing { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
@-webkit-keyframes alertPulse { 0% { box-shadow: 0 0 0 0 rgba(185, 154, 214, .75); } 70% { box-shadow: 0 0 0 3vmin rgba(185, 154, 214, 0); } 100% { box-shadow: 0 0 0 0 rgba(185, 154, 214, 0); } }
@keyframes alertPulse { 0% { box-shadow: 0 0 0 0 rgba(185, 154, 214, .75); } 70% { box-shadow: 0 0 0 3vmin rgba(185, 154, 214, 0); } 100% { box-shadow: 0 0 0 0 rgba(185, 154, 214, 0); } }
@media (prefers-reduced-motion: reduce) { .slide.alert, .key-icon { -webkit-animation: none; animation: none; } }
</style>

<script>
(function () {
  var SECONDS = 10;
  var data = JSON.parse(document.getElementById('rutas-data').textContent);
  var slidesEl = document.getElementById('slides');
  var dotsEl = document.getElementById('dots');
  var bar = document.getElementById('bar');

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function parseDate(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dayKey(d) { return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
  var fmtLong = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  var fmtShort = new Intl.DateTimeFormat('es-ES', { day: 'numeric', month: 'short' });
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  // Tipos: turno ("R1 ruta 13"), ruta suelta ("Ruta 24"), valija, guardia u otra tarea
  function parseTask(t) {
    var o = (typeof t === 'string') ? { texto: t } : t;
    var r = classify(o.texto || '');
    r.codigo = o.codigo || '';
    return r;
  }
  function classify(t) {
    var m = /^\s*(R\d)\s+(.*)$/i.exec(t);
    if (m) return { kind: 'turno', turno: m[1].toUpperCase(), texto: cap(m[2].trim()) };
    var txt = cap(t.trim());
    if (/^ruta\b/i.test(txt)) return { kind: 'ruta', texto: txt, badge: 'Ruta' };
    if (/valija/i.test(txt)) return { kind: 'special', texto: txt, badge: 'Valija' };
    if (/guardia/i.test(txt)) return { kind: 'special', texto: txt, badge: 'Guardia' };
    return { kind: 'special', texto: txt, badge: 'Tarea' };
  }
  function subline(x) {
    return [x.codigo].filter(function (v) { return v; }).join(' · ');
  }

  // Días a mostrar: hoy y siguientes (los pasados se descartan)
  var now = new Date();
  var todayKey = dayKey(now);
  var tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  var dias = (data.dias || []).filter(function (d) { return dayKey(parseDate(d.fecha)) >= todayKey; });
  var hasToday = dias.length > 0;

  function dayLabel(d) {
    var k = dayKey(parseDate(d.fecha));
    if (k === todayKey) return 'Hoy';
    if (k === dayKey(tomorrow)) return 'Mañana';
    return cap(new Intl.DateTimeFormat('es-ES', { weekday: 'long' }).format(parseDate(d.fecha)));
  }
  function head(s, d, kicker) {
    var row = el('div', 'kicker');
    var isToday = dayKey(parseDate(d.fecha)) === todayKey;
    row.appendChild(el('span', 'daytag' + (isToday ? ' today' : ''), dayLabel(d)));
    row.appendChild(el('span', 'dayname', cap(fmtLong.format(parseDate(d.fecha)))));
    row.appendChild(el('span', 'eyebrow', kicker));
    s.appendChild(row);
  }

  var slides = [];

  function summarySlide(d) {
    var s = el('section', 'slide');
    head(s, d, 'Resumen');
    s.appendChild(el('h1', null, dayKey(parseDate(d.fecha)) === todayKey ? 'Quién lleva cada turno' : 'Rutas de ' + dayLabel(d).toLowerCase()));
    if (!d.transportistas.length) {
      s.appendChild(el('p', 'empty-note', 'No hay rutas asignadas en el calendario para este día.'));
      slides.push(s); return;
    }
    var all = [];
    d.transportistas.forEach(function (t) { all.push(t.tareas.map(parseTask)); });
    var turnos = ['R1', 'R2', 'R3', 'R4'].filter(function (t) {
      return all.some(function (ts) { return ts.some(function (x) { return x.turno === t; }); });
    });
    var wrap = el('div', 'board-wrap');
    var table = el('table', 'board' + (d.transportistas.length > 6 ? ' dense' : ''));
    var thead = el('thead'); var hr = el('tr');
    hr.appendChild(el('th', null, 'Transportista'));
    turnos.forEach(function (t) { var th = el('th', 'shift'); th.appendChild(el('span', null, t)); hr.appendChild(th); });
    hr.appendChild(el('th', null, turnos.length ? 'Otras rutas, valijas y guardias' : 'Rutas y tareas'));
    thead.appendChild(hr); table.appendChild(thead);
    var tb = el('tbody');
    d.transportistas.forEach(function (t, n) {
      var tasks = all[n];
      var tr = el('tr');
      tr.appendChild(el('td', 'name', t.nombre));
      turnos.forEach(function (tu) {
        var here = tasks.filter(function (x) { return x.turno === tu; });
        var td = el('td', 'cell' + (here.length ? '' : ' empty'));
        if (!here.length) td.textContent = '—';
        here.forEach(function (x) {
          td.appendChild(el('span', 'multi', x.texto.replace(/^ruta\s*/i, '')));
        });
        tr.appendChild(td);
      });
      var td = el('td', 'extra');
      var rest = tasks.filter(function (x) { return x.kind !== 'turno'; });
      if (!rest.length) td.textContent = '—';
      rest.forEach(function (x, i) {
        if (i) td.appendChild(document.createTextNode(' · '));
        td.appendChild(el('span', x.kind === 'ruta' ? 'r' : 's', x.texto));
      });
      tr.appendChild(td);
      tb.appendChild(tr);
    });
    table.appendChild(tb); wrap.appendChild(table); s.appendChild(wrap);
    slides.push(s);
  }

  function driverSlides(d) {
    d.transportistas.forEach(function (t) {
      var s = el('section', 'slide');
      head(s, d, 'Transportista');
      var g = el('div', 'driver');
      var who = el('div', 'who');
      who.appendChild(el('h2', null, t.nombre));
      var tasks = t.tareas.map(parseTask);
      var nRutas = tasks.filter(function (x) { return x.kind === 'turno' || x.kind === 'ruta'; }).length;
      who.appendChild(el('div', 'count', nRutas + (nRutas === 1 ? ' ruta' : ' rutas') + ' · ' + tasks.length + (tasks.length === 1 ? ' tarea' : ' tareas')));
      var ul = el('ul', 'tasks');
      tasks.forEach(function (x) {
        var li = el('li', 'task' + (x.kind === 'turno' ? '' : (x.kind === 'ruta' ? ' route' : ' special')));
        li.appendChild(el('span', 'badge', x.turno || x.badge));
        var w = el('span', 'what', x.texto);
        if (subline(x)) w.appendChild(el('small', null, subline(x)));
        li.appendChild(w);
        ul.appendChild(li);
      });
      g.appendChild(who); g.appendChild(ul); s.appendChild(g);
      slides.push(s);
    });
  }

  function absenceSlide(d) {
    if (!d.ausencias || !d.ausencias.length) return;
    var s = el('section', 'slide');
    head(s, d, 'Ausencias y libranzas');
    var isToday = dayKey(parseDate(d.fecha)) === todayKey;
    s.appendChild(el('h1', null, isToday ? 'Hoy no están' : dayLabel(d) + ' no están'));
    var grid = el('div', 'absences');
    d.ausencias.forEach(function (a) {
      var c = el('article', 'absence');
      c.appendChild(el('div', 'kind', a.tipo));
      c.appendChild(el('div', 'n', a.nombre));
      if (a.detalle) c.appendChild(el('div', 'd', a.detalle));
      if (a.hasta) {
        var txt = a.desde && a.desde !== a.hasta
          ? 'Del ' + fmtShort.format(parseDate(a.desde)) + ' al ' + fmtShort.format(parseDate(a.hasta))
          : 'Solo ' + fmtShort.format(parseDate(a.hasta));
        c.appendChild(el('div', 'r', txt));
      }
      grid.appendChild(c);
    });
    s.appendChild(grid);
    slides.push(s);
  }

  // Recordatorio de los lunes (según el día que marca la TV)
  var isMonday = now.getDay() === 1;
  function reminderSlide() {
    var s = el('section', 'slide alert');
    var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    icon.setAttribute('viewBox', '0 0 64 64'); icon.setAttribute('class', 'key-icon'); icon.setAttribute('aria-hidden', 'true');
    icon.innerHTML = '<circle cx="20" cy="22" r="14" fill="#ffffff"/><circle cx="20" cy="22" r="6" fill="#5a287e"/>' +
      '<rect x="30" y="18.5" width="29" height="7" rx="2" fill="#ffffff"/><rect x="46" y="25" width="5" height="10" rx="1" fill="#ffffff"/>' +
      '<rect x="53" y="25" width="5" height="7" rx="1" fill="#ffffff"/>';
    s.appendChild(icon);
    s.appendChild(el('div', 'alert-tag', 'Recordatorio de los lunes'));
    var h = el('h1', 'alert-msg');
    h.appendChild(document.createTextNode('Recordar coger '));
    h.appendChild(el('mark', null, 'las llaves'));
    h.appendChild(document.createTextNode(' de las rutas'));
    s.appendChild(h);
    return s;
  }
  if (isMonday) slides.push(reminderSlide());

  // Hoy: resumen, una ficha por transportista y ausencias. Mañana: resumen y ausencias.
  dias.forEach(function (d) {
    var isToday = dayKey(parseDate(d.fecha)) === todayKey;
    if (isMonday && !isToday && slides.length > 3) slides.push(reminderSlide()); // se repite antes de mañana
    summarySlide(d);
    if (isToday || dias.length === 1) driverSlides(d);
    absenceSlide(d);
  });
  if (!slides.length) {
    var s0 = el('section', 'slide');
    s0.appendChild(el('div', 'eyebrow', 'Sin datos'));
    s0.appendChild(el('h1', null, 'No hay rutas cargadas para hoy'));
    slides.push(s0);
  }

  slides.forEach(function (s, i) {
    slidesEl.appendChild(s);
    var b = el('button', 'dot'); b.type = 'button'; b.setAttribute('aria-label', 'Diapositiva ' + (i + 1));
    b.addEventListener('click', function () { go(i); });
    dotsEl.appendChild(b);
  });

  // Rotación
  var idx = 0, paused = false, start = performance.now(), elapsed = 0;
  function go(i) {
    idx = (i + slides.length) % slides.length;
    slides.forEach(function (s, k) { s.classList.toggle('on', k === idx); });
    Array.prototype.forEach.call(dotsEl.children, function (d, k) { d.classList.toggle('on', k === idx); });
    start = performance.now(); elapsed = 0;
  }
  function tick(now) {
    if (!paused) {
      elapsed = (now - start) / 1000;
      if (elapsed >= SECONDS) go(idx + 1);
    }
    bar.style.width = Math.min(100, (elapsed / SECONDS) * 100) + '%';
    requestAnimationFrame(tick);
  }
  go(0); requestAnimationFrame(tick);

  var pauseBtn = document.getElementById('pause');
  function togglePause() {
    paused = !paused;
    if (!paused) start = performance.now() - elapsed * 1000;
    pauseBtn.textContent = paused ? 'Continuar' : 'Pausa';
  }
  pauseBtn.addEventListener('click', togglePause);

  // Mando de la TV / teclado
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.keyCode === 39) { go(idx + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.keyCode === 37) { go(idx - 1); e.preventDefault(); }
    else if (e.key === ' ' && document.activeElement === document.body) { togglePause(); e.preventDefault(); }
  });

  // Pantalla completa: API estándar y versiones con prefijo (navegadores de TV antiguos)
  var fsBtn = document.getElementById('fs');
  var root = document.documentElement;
  var reqFs = root.requestFullscreen || root.webkitRequestFullscreen || root.webkitRequestFullScreen || root.mozRequestFullScreen || root.msRequestFullscreen;
  var exitFs = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen || document.mozCancelFullScreen || document.msExitFullscreen;
  function isFs() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.webkitCurrentFullScreenElement || document.mozFullScreenElement || document.msFullscreenElement);
  }
  function enterFs() {
    if (!reqFs || isFs()) return;
    try { var r = reqFs.call(root); if (r && r.catch) r.catch(function () {}); } catch (err) {}
  }
  function leaveFs() {
    if (!exitFs || !isFs()) return;
    try { var r = exitFs.call(document); if (r && r.catch) r.catch(function () {}); } catch (err) {}
  }
  function syncFsBtn() { fsBtn.textContent = isFs() ? 'Salir de pantalla completa' : 'Pantalla completa'; }
  if (!reqFs) {
    fsBtn.hidden = true; // este navegador no permite pantalla completa desde la página
  } else {
    fsBtn.addEventListener('click', function (e) { e.stopPropagation(); if (isFs()) leaveFs(); else enterFs(); });
    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
      document.addEventListener(ev, syncFsBtn);
    });
    // Con el mando: la primera pulsación de cualquier tecla o clic activa la pantalla completa
    var firstTouch = function () { enterFs(); };
    document.addEventListener('keydown', firstTouch);
    document.addEventListener('click', firstTouch);
  }

  // Mantener la pantalla encendida si el navegador lo permite
  function wake() {
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (err) {}
  }
  wake();
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') wake(); });

  // Ocultar el cursor salvo al mover el ratón
  var hideT;
  document.addEventListener('mousemove', function () {
    document.body.classList.add('pointer');
    clearTimeout(hideT); hideT = setTimeout(function () { document.body.classList.remove('pointer'); }, 2500);
  });

  // Reloj, fecha de hoy y aviso si no hay datos de hoy
  var dateEl = document.getElementById('date'), clockEl = document.getElementById('clock'), metaEl = document.getElementById('meta');
  var upd = new Date(data.actualizado);
  var loadedKey = todayKey;
  function clock() {
    var n = new Date();
    if (dayKey(n) !== loadedKey) { location.reload(); return; } // cambio de día: recalcula Hoy/Mañana
    clockEl.textContent = n.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    dateEl.textContent = cap(fmtLong.format(n));
    metaEl.textContent = '';
    if (hasToday) {
      metaEl.textContent = 'Actualizado ' + fmtShort.format(upd) + ', ' + upd.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    } else {
      metaEl.appendChild(el('span', 'stale', 'Sin rutas cargadas · última actualización ' + fmtShort.format(upd)));
    }
  }
  clock(); setInterval(clock, 15000);
})();
</script>

<script>
// Recarga automática: cada minuto mira si en GitHub hay una versión nueva de la página
// (compara la fecha "actualizado" de los datos) y, si la hay, recarga. Sin botones.
(function () {
  var base = location.pathname;
  var current = (JSON.parse(document.getElementById('rutas-data').textContent) || {}).actualizado || '';
  function check() {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', base + '?check=' + Date.now(), true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4 || xhr.status !== 200) return;
      var m = /"actualizado"\s*:\s*"([^"]+)"/.exec(xhr.responseText);
      if (m && m[1] !== current) location.replace(base + '?t=' + Date.now());
    };
    try { xhr.send(); } catch (e) {}
  }
  setInterval(check, 60 * 1000);
  // Por seguridad, recarga completa cada hora aunque no detecte cambios
  setTimeout(function () { location.replace(base + '?t=' + Date.now()); }, 60 * 60 * 1000);
})();
</script>
